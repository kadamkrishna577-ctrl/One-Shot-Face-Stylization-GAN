<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One-Shot Face Stylization</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-8">

    <div class="max-w-5xl mx-auto">
        <h1 class="text-4xl font-bold mb-8 text-center text-blue-400">Neural Style Hub</h1>
        
        <div class="grid md:grid-cols-3 gap-8">
            <!-- Upload Form -->
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 h-fit">
                <form id="stylize-form">
                    <label class="block mb-2">1. Upload Face</label>
                    <input type="file" id="file-input" class="mb-4 w-full" accept="image/*" required>

                    <label class="block mb-2">2. Style</label>
                    <select id="style-select" class="w-full mb-6 text-black p-2 rounded">
                        <option value="anime">Anime</option>
                        <option value="sketch">Sketch</option>
                        <option value="cartoon">Cartoon</option>
                        <option value="watercolor">Watercolor</option>
                        <option value="cyberpunk">Cyberpunk</option>
                    </select>

                    <button type="submit" id="submit-btn" class="w-full bg-blue-600 p-3 rounded font-bold hover:bg-blue-500">
                        Generate
                    </button>
                    
                    <!-- ON-PAGE DEBUGGER -->
                    <div class="mt-6 p-4 bg-black rounded border border-gray-600 font-mono text-xs text-green-400 break-words">
                        <p class="text-white font-bold mb-2">System Log:</p>
                        <div id="debug-log">Waiting for input...<br></div>
                    </div>
                </form>
            </div>

            <!-- Result Image -->
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 text-center col-span-2">
                <h3 class="mb-4 font-bold text-green-400">Stylized Result</h3>
                <img id="stylized-img" class="mx-auto rounded-lg shadow-lg w-full max-w-md object-cover aspect-square bg-gray-900" />
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('stylize-form');
        const fileInput = document.getElementById('file-input');
        const stylizedImg = document.getElementById('stylized-img');
        const submitBtn = document.getElementById('submit-btn');
        const debugLog = document.getElementById('debug-log');

        function log(msg) {
            debugLog.innerHTML += msg + "<br>";
            console.log(msg);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.innerText = "Processing...";
            debugLog.innerHTML = ""; // clear log
            stylizedImg.removeAttribute('src'); 

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('style', document.getElementById('style-select').value);

            try {
                log("1. Sending request to http://127.0.0.1:8000/stylize ...");
                
                const response = await fetch('http://127.0.0.1:8000/stylize', {
                    method: 'POST',
                    body: formData
                });

                log(`2. Received Response Status: ${response.status}`);
                
                if (!response.ok) {
                    log(`ERROR: Server returned ${response.statusText}`);
                    return;
                }

                log("3. Downloading image bytes...");
                const blob = await response.blob();
                
                log(`4. Blob size: ${blob.size} bytes. Type: ${blob.type}`);

                if (blob.size === 0) {
                    log("ERROR: Received 0 bytes from server.");
                    return;
                }

                log("5. Creating local image URL...");
                const imgUrl = URL.createObjectURL(blob);
                
                log("6. Setting image on screen!");
                stylizedImg.src = imgUrl;

            } catch (err) {
                log(`<span class="text-red-500">FETCH ERROR: ${err.message}</span>`);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Generate";
            }
        });
    </script>
</body>
</html>
